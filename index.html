<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Banking Landscape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #dd1f26;
    --blue: #21418d;
    --light-blue: #eef1f8;
    --dark: #1a1a1a;
    --border: #e0e0e0;
  }

  html, body { background: #fafafa; }

  body {
    font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }

  /* Responsive square: fills the screen width, max 1080x1080, always 1:1 */
  .graphic {
    width: 100%;
    max-width: 1080px;
    aspect-ratio: 1 / 1;
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin: 0 auto;
    padding: clamp(10px, 2.2cqw, 24px) clamp(10px, 1.9cqw, 20px) clamp(6px, 1.5cqw, 16px);
    background: #fafafa;
  }
  /* Phones/tablets: slightly taller (4:5) so ~5 banks are visible. Desktop stays 1:1 */
  @media (max-width: 700px) {
    .graphic { aspect-ratio: 4 / 5; }
  }
  /* container-type sizes children by .graphic's width */
  .graphic > * { min-width: 0; }

  /* Header */
  .header {
    text-align: center;
    flex: 0 0 auto;
    padding-bottom: clamp(4px, 1cqw, 10px);
  }
  .header h1 {
    font-size: clamp(19px, 3.2cqw, 34px);
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .header .subhead {
    font-size: clamp(11.5px, 1.6cqw, 17px);
    font-weight: 600;
    color: var(--blue);
    margin-top: 2px;
  }

  /* Search */
  .search-wrap {
    position: relative;
    flex: 0 0 auto;
    margin-bottom: clamp(5px, 1cqw, 10px);
  }
  .search-wrap input {
    width: 100%;
    padding: clamp(8px, 1.2cqw, 13px) 14px clamp(8px, 1.2cqw, 13px) clamp(34px, 4.4cqw, 48px);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: max(16px, 1.7cqw); /* 16px min stops iOS zooming on focus */
    font-family: inherit;
    background: #fff;
    outline: none;
    -webkit-appearance: none;
  }
  .search-wrap input:focus { border-color: var(--blue); }
  .search-wrap .icon {
    position: absolute;
    left: clamp(10px, 1.5cqw, 16px);
    top: 50%;
    transform: translateY(-50%);
    width: clamp(15px, 1.9cqw, 20px);
    height: clamp(15px, 1.9cqw, 20px);
    color: #aaa;
  }
  .search-wrap input::placeholder { color: #bbb; }

  /* Filter pills: one swipeable row on small screens, wrapped + centred on large */
  .tabs {
    display: flex;
    flex-wrap: nowrap;
    gap: 5px;
    flex: 0 0 auto;
    margin-bottom: clamp(4px, 0.8cqw, 8px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  @container (min-width: 700px) {
    .tabs { flex-wrap: wrap; justify-content: center; overflow: visible; }
  }
  .tab {
    flex: 0 0 auto;
    padding: clamp(6px, 0.9cqw, 9px) clamp(11px, 1.7cqw, 18px);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    background: #fff;
    font-size: clamp(12px, 1.5cqw, 15.5px);
    font-weight: 600;
    color: #555;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .tab:not(.active):active { background: var(--light-blue); }

  /* Scrollable bank list: fills the rest of the square */
  .scroll-container {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding-right: 4px;
    min-height: 0;
  }
  /* Spacer so the last card (Postbank) never sits flush against the clipped edge
     (Safari/Android Chrome can swallow bottom padding in scroll containers) */
  .scroll-container::after {
    content: "";
    display: block;
    height: 14px;
    flex: 0 0 auto;
  }

  /* Section headers */
  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: clamp(8px, 1.3cqw, 14px) 0 6px;
    padding-bottom: 5px;
    border-bottom: 2px solid var(--blue);
  }
  .section-header .badge {
    width: 7px;
    height: clamp(20px, 3cqw, 32px);
    border-radius: 3px;
    flex: 0 0 auto;
  }
  .section-header h2 {
    font-size: clamp(14.5px, 1.9cqw, 20px);
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.01em;
  }
  .mcap-row-header {
    text-align: right;
    padding-right: clamp(44px, 5.4cqw, 58px);
    font-size: clamp(10.5px, 1.3cqw, 13px);
    font-weight: 700;
    color: var(--red);
    margin-bottom: 3px;
  }

  /* Bank cards */
  .bank-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .bank-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .bank-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(8px, 1.1cqw, 12px) clamp(10px, 1.5cqw, 16px);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bank-name {
    font-size: clamp(14.5px, 1.8cqw, 18.5px);
    font-weight: 700;
    color: var(--dark);
    flex: 1;
    padding-right: 8px;
  }
  .bank-mcap {
    flex: 0 0 auto;
    font-size: clamp(11.5px, 1.4cqw, 14.5px);
    font-weight: 700;
    color: var(--red);
    background: #fdf0f1;
    padding: 4px clamp(7px, 1.1cqw, 12px);
    border-radius: 6px;
    white-space: nowrap;
  }
  .expand-btn {
    flex: 0 0 auto;
    width: clamp(28px, 3.2cqw, 34px);
    height: clamp(28px, 3.2cqw, 34px);
    border: none;
    background: var(--light-blue);
    border-radius: 50%;
    color: var(--blue);
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: clamp(6px, 1cqw, 10px);
    transition: transform 0.25s;
    -webkit-tap-highlight-color: transparent;
  }
  .expand-btn.open { transform: rotate(45deg); }

  .bank-desc {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 clamp(10px, 1.5cqw, 16px);
  }
  .bank-desc-inner {
    padding: 9px 0 11px;
    font-size: clamp(13px, 1.55cqw, 15.5px);
    color: #444;
    line-height: 1.5;
    border-top: 1px solid var(--border);
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 30px 20px;
    color: #999;
    font-size: 0.88rem;
  }

  /* Credits row */
  .credits-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex: 0 0 auto;
    padding-top: clamp(6px, 1cqw, 10px);
    gap: 12px;
  }
  .credits-text {
    font-size: clamp(10px, 1.3cqw, 13px);
    line-height: 1.5;
    color: #1a1a1a;
    font-weight: 600;
  }
  .credits-text .credit-label {
    font-weight: 400;
    color: #666;
  }
  .n24-logo {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: clamp(28px, 3.6cqw, 40px);
  }
  .n24-logo svg {
    height: 100%;
    width: auto;
  }
</style>
</head>

  { cat: "listed", catLabel: "The Listed Players", name: "Nedbank", mcap: "R141 billion", desc: "With more than 8 million clients across the group, Nedbank is making a push into East Africa after buying Kenya's NCBA Group, and is also looking to bank more entrepreneurs and merchants in the local economy with its buyout of fintech iKhokha." },
  { cat: "listed", catLabel: "The Listed Players", name: "Investec", mcap: "R127.6 billion", desc: "The private bank and wealth manager's international private client ecosystem comprises 127 467 SA Private Bank clients, 27 220 Wealth & Investment International annuity clients, and 8 188 UK Private Bank clients, with 56% of the SA Private Bank base also holding a Wealth & Investment International relationship." },

  { cat: "new", catLabel: "New Kids on the Block", name: "Discovery Bank", mcap: null, desc: "CEO Hylton Kallner says his ambition to build a \u201csuper bank\u201d goes beyond cross-selling Discovery products to the lender's 1.6 million customers." },
  { cat: "new", catLabel: "New Kids on the Block", name: "OM Bank", mcap: null, desc: "Old Mutual's fledgling lender is closing in on 1m customers and has the advantage of being able to cross-sell into its parent's more than 7 million customers in SA alone." },
  { cat: "new", catLabel: "New Kids on the Block", name: "Bank Zero", mcap: null, desc: "Now part of Lesaka Technologies, the lender is forging alliances with fintechs, and has ambitions to add foreign exchange, lending and cross-border payments to its repertoire." },
  { cat: "wildcard", catLabel: "Wildcards", name: "PEP Bank", mcap: null, desc: "Dubbed PlusB by its parent, Pepkor, it has a distribution footprint spanning more than 7 000 retail stores and has snared highly rated outgoing OUTsurance CFO Jan Hofmeyr, who will form part of its executive team." },
  { cat: "wildcard", catLabel: "Wildcards", name: "Revolut", mcap: null, desc: "The digital-first UK-headquartered lender has applied for a banking licence in SA and aims to launch locally in 2028." },

];

const catColours = {
  listed: "#21418d",
  new: "#dd1f26",
  wildcard: "#2a8c3a",
  up: "#7a5c9e",
};

let activeCat = "all";
let searchTerm = "";

const content = document.getElementById("content");

function render() {
  const filtered = banks.filter(b => {
    const catMatch = activeCat === "all" || b.cat === activeCat;
    const searchMatch = !searchTerm ||
      b.name.toLowerCase().includes(searchTerm) ||
      b.desc.toLowerCase().includes(searchTerm) ||
      b.catLabel.toLowerCase().includes(searchTerm);
    return catMatch && searchMatch;
  });

  if (filtered.length === 0) {
    content.innerHTML = '<div class="no-results">No banks match your search.</div>';
    return;
  }

  let html = "";
  let prevCat = "";

  filtered.forEach((b, i) => {
    if (b.cat !== prevCat) {
      html += '<div class="section-header">' +
        '<div class="badge" style="background:' + catColours[b.cat] + '"></div>' +
        '<h2>' + b.catLabel + '</h2></div>';
      if (b.cat === 'listed') {
        html += '<div class="mcap-row-header">Market Cap</div>';
      }
      prevCat = b.cat;
    }

    const mcapHtml = b.mcap
      ? '<span class="bank-mcap">' + b.mcap + '</span>'
      : '';

    html += '<div class="bank-card" data-idx="' + i + '">' +
      '<div class="bank-header" onclick="toggle(this)">' +
        '<div class="bank-name">' + b.name + '</div>' +
        mcapHtml +
        '<button class="expand-btn" aria-label="Expand">+</button>' +
      '</div>' +
      '<div class="bank-desc"><div class="bank-desc-inner">' + b.desc + '</div></div>' +
    '</div>';
  });

  content.innerHTML = html;
}

function toggle(headerEl) {
  const card = headerEl.parentElement;
  const desc = card.querySelector(".bank-desc");
  const btn = headerEl.querySelector(".expand-btn");
  if (desc.style.maxHeight && desc.style.maxHeight !== "0px") {
    desc.style.maxHeight = "0px";
    btn.classList.remove("open");
  } else {
    desc.style.maxHeight = desc.scrollHeight + "px";
    btn.classList.add("open");
  }
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeCat = tab.dataset.cat;
    render();
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

render();

window.addEventListener("resize", () => {
  document.querySelectorAll(".bank-desc").forEach(d => {
    if (d.style.maxHeight && d.style.maxHeight !== "0px") {
      d.style.maxHeight = d.scrollHeight + "px";
    }
  });
});
</script>
</body>
</html>
